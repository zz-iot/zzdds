name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version prefix (semver, e.g. 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run — run tests and interop but skip version bump, tag, and release'
        required: false
        type: boolean
        default: false

jobs:
  # ── Validate inputs and compute the full version tag ──────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      zig_version: ${{ steps.ver.outputs.zig_version }}
      full_version: ${{ steps.ver.outputs.full_version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version tag
        id: ver
        run: |
          ZIG_VER=$(grep 'minimum_zig_version' build.zig.zon | sed 's/.*"\(.*\)".*/\1/')
          FULL_VERSION="${{ inputs.version }}-zig.${ZIG_VER}"
          TAG="v${FULL_VERSION}"
          echo "zig_version=${ZIG_VER}"       >> $GITHUB_OUTPUT
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"                   >> $GITHUB_OUTPUT
          echo "Tag will be: ${TAG}"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.ver.outputs.zig_version }}

      - name: Verify Zig version matches minimum_zig_version
        run: |
          ACTUAL=$(zig version)
          EXPECTED="${{ steps.ver.outputs.zig_version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: runner Zig is ${ACTUAL}, build.zig.zon requires ${EXPECTED}"
            exit 1
          fi
          echo "Zig version verified: ${ACTUAL}"

      - name: Check tag does not already exist
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "ERROR: tag ${TAG} already exists on origin"
            exit 1
          fi

  # ── Full test suite (same matrix as CI) ───────────────────────────────────
  test:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ needs.prepare.outputs.zig_version }}

      - name: Verify Zig version
        shell: bash
        run: |
          ACTUAL=$(zig version)
          EXPECTED="${{ needs.prepare.outputs.zig_version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: runner Zig is ${ACTUAL}, expected ${EXPECTED}"
            exit 1
          fi

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: zig fmt --check src/ test/

      - name: Allow inbound UDP (Windows)
        if: runner.os == 'Windows'
        run: netsh advfirewall firewall add rule name="zzdds-test-udp" protocol=UDP dir=in action=allow

      - name: Test
        run: zig build test

      - name: Test (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast

      # Linux x86_64 only: `test-release-small` forces the LLVM backend to work
      # around a Zig 0.16 self-hosted-x86_64 bug that mis-aligns read-only
      # globals at -OReleaseSmall (see the step's comment in build.zig). That
      # workaround path has only been exercised on Linux; broaden this to the
      # whole matrix -- as a plain `zig build test -Doptimize=ReleaseSmall` --
      # at the Zig 0.17 bump, when the underlying bug is gone.
      - name: Test (ReleaseSmall, LLVM backend)
        if: matrix.os == 'ubuntu-latest'
        run: zig build test-release-small -Doptimize=ReleaseSmall

      # Binding smoke tests, mirroring ci.yml's test-other job: the release
      # gate previously ran only `zig build test` (+ReleaseFast +TSan) and
      # never built a single binding, so a PR breaking the C/C++/Java
      # generated bindings could still cut a release. `test-bindings` is
      # pure Zig-build-system (zig cc / zig c++, no external CMake), so it
      # runs on every platform; Java/JNI on Windows stays deferred (see
      # ci.yml's test-other for the full CFG-hypothesis writeup).
      - name: Install JDK (java-binding needs jni.h, not just a JRE)
        if: runner.os != 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: C/C++/Java binding smoke tests
        if: runner.os != 'Windows'
        shell: bash
        run: zig build test-bindings -Dc-binding=true -Dcpp-binding=true -Djava-binding=true 2>&1 | tee "$RUNNER_TEMP/binding-smoke.log"

      - name: C/C++ binding smoke tests (Windows -- Java deferred, see ci.yml)
        if: runner.os == 'Windows'
        shell: bash
        run: zig build test-bindings -Dc-binding=true -Dcpp-binding=true 2>&1 | tee "$RUNNER_TEMP/binding-smoke.log"

      # build.zig downgrades missing JDK/JNI headers or javac to a
      # std.log.warn + skip rather than a build failure -- without this
      # check a broken setup-java wiring would silently pass instead of
      # actually testing the Java binding.
      - name: Verify no binding was silently skipped
        shell: bash
        run: |
          if grep -qE "jni\.h not found|javac not found" "$RUNNER_TEMP/binding-smoke.log"; then
            echo "::error::A binding was silently skipped instead of tested — see build.zig's std.log.warn fallbacks"
            exit 1
          fi

      # ThreadSanitizer (Clang/LLVM) has no real Windows support. macOS is
      # deliberately NOT included here either, despite being TSan-capable in
      # principle -- see ci.yml's test-other job for why: even the minimal
      # test-tsan-self-check segfaults with zero sanitizer output on macOS
      # ARM64 (macos-latest), which looks like an upstream Zig/LLVM gap
      # (suspected private Apple API breakage in libtsan's startup path), not
      # something fixable from zzdds's side. test-tsan-self-check runs first
      # here, same as ci.yml's equivalent lane -- it proves TSan
      # instrumentation is actually active before trusting a clean test-tsan
      # run as real coverage rather than silently-inert instrumentation
      # (flagged by Greptile on an earlier version of this PR, which had this
      # step run test-tsan alone).
      - name: Test (TSan)
        if: matrix.os == 'ubuntu-latest'
        run: |
          zig build test-tsan-self-check
          zig build test-tsan

  # ── Self-interop gate (same as CI) ────────────────────────────────────────
  # Uses the stable binary name (no -Ddds-version) — the versioned name is for
  # official dds-rtps submission, not the CI gate.
  #
  # NOTE: When ci.yml's INTEROP_RTPS_REF is bumped to a new zenzen branch, bump
  # the ref below to match — this job must stay in sync with ci.yml's
  # self-interop job (same checkout, same symlink wiring) or it will build the
  # current zzdds against a stale dds-rtps harness and fail with API mismatches.
  self-interop:
    name: self-interop (dds-rtps)
    needs: [prepare, test]
    runs-on: ubuntu-latest
    env:
      INTEROP_RTPS_REF: zenzen-c052430

    steps:
      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          path: zzdds

      - name: Check out dds-rtps (${{ env.INTEROP_RTPS_REF }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/dds-rtps
          ref: ${{ env.INTEROP_RTPS_REF }}
          path: dds-rtps

      - name: Wire packages/zzdds symlink
        run: |
          mkdir -p dds-rtps/srcZig/zzdds/packages
          ln -s ../../../../zzdds dds-rtps/srcZig/zzdds/packages/zzdds
          # zzdds now re-exports zidl's own artifact and zidl_rt module (see
          # zzdds's build.zig comment on b.modules.put(... "zidl_rt" ...) /
          # b.installArtifact(zidl_exe)), and dds-rtps's build.zig.zon no
          # longer declares its own .zidl dependency — zig resolves zidl
          # transitively through this zzdds path dep, so no separate zidl
          # checkout/symlink is needed here anymore.
          #
          # zig-pkg/ is gitignored so actions/checkout does not clean it between
          # runs on the same runner.  Stale URL-fetched packages shadow the path
          # dep above via fingerprint deduplication — wipe them first.
          rm -rf dds-rtps/srcZig/zzdds/zig-pkg/
          (cd dds-rtps/srcZig/zzdds && python3 point_zon_at_symlinks.py)

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ needs.prepare.outputs.zig_version }}

      - name: Install Python (match omg-dds/dds-rtps interop workflow)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"

      - name: Install Python dependencies
        run: pip install --requirement dds-rtps/requirements.txt

      - name: Build shape_main (ReleaseSafe)
        working-directory: dds-rtps/srcZig/zzdds
        run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe

      - name: Run self-interop suite
        working-directory: dds-rtps
        run: |
          python3 interoperability_report.py \
            -P srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux \
            -S srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux \
            -o /tmp/interop-results.xml

      - name: Check results
        run: python3 zzdds/scripts/check_interop_results.py /tmp/interop-results.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-interop-results
          path: /tmp/interop-results.xml

  # ── Prebuilt C/C++ library bundles ───────────────────────────────────────
  #
  # release.yml previously published only a git tag + a `zig fetch` URL --
  # nothing for C/C++ consumers who don't build from source. This job builds
  # the install tree (dynamic libzzdds + static libzidl_cdr + headers +
  # pkgconfig + CMake package files) on each release platform and uploads it
  # as a per-platform tarball; `publish` attaches them to the GitHub release.
  #
  # The *functional* smoke test of these libraries is the `test` job's
  # `test-bindings` step, which compiles and runs real C/C++/Java programs
  # against a freshly built libzzdds on every platform -- this job only has
  # to confirm the install tree is complete before packaging it.
  package-libs:
    name: package-libs (${{ matrix.name }})
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ needs.prepare.outputs.zig_version }}

      - name: Build install tree (C + C++ bindings)
        run: zig build -Dc-binding=true -Dcpp-binding=true install

      - name: Verify install tree is complete
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # Dynamic libzzdds -- extension and directory differ per platform
          # (.dll lands in bin/ on Windows, since Zig's InstallArtifact
          # treats a .dll as isDll()).
          if ! ls zig-out/lib/libzzdds.so zig-out/lib/libzzdds.dylib \
                  zig-out/bin/zzdds.dll zig-out/lib/zzdds.dll 2>/dev/null | grep -q .; then
            echo "::error::no dynamic libzzdds found under zig-out/"
            fail=1
          fi
          for f in zig-out/include/dcps.h zig-out/include/zzdds.h zig-out/include/zidl_cdr.h \
                   zig-out/lib/pkgconfig/zzdds.pc zig-out/lib/cmake/ZZDDS/zzdds-config.cmake; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          # The bundle is renamed and extracted elsewhere, so zzdds.pc must be
          # relocatable (prefix derived from ${pcfiledir}) rather than carrying
          # a baked-in absolute build path.
          if ! grep -qE '^prefix=\$\{pcfiledir\}' zig-out/lib/pkgconfig/zzdds.pc; then
            echo "::error::zzdds.pc prefix= is not \${pcfiledir}-relative — bundle would not be relocatable"
            grep '^prefix=' zig-out/lib/pkgconfig/zzdds.pc
            fail=1
          fi
          [ "$fail" -eq 0 ]

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dir="zzdds-${{ needs.prepare.outputs.full_version }}-${{ matrix.name }}"
          mv zig-out "$dir"
          tar -czf "${dir}.tar.gz" "$dir"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: libbundle-${{ matrix.name }}
          path: "*.tar.gz"
          retention-days: 7

  # ── Version bump, tag, and GitHub release ─────────────────────────────────
  publish:
    name: Publish
    needs: [prepare, self-interop, package-libs]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prebuilt library bundles
        uses: actions/download-artifact@v4
        with:
          pattern: libbundle-*
          path: dist
          merge-multiple: true

      - name: Bump version in build.zig.zon
        env:
          FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
        run: |
          sed -i 's/\.version = "[^"]*"/.version = "'"${FULL_VERSION}"'"/' build.zig.zon

      - name: Commit and push version bump
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.zig.zon
          git commit -m "release: ${TAG}"
          git push

      - name: Create and push tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Generate changelog
        id: changelog
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD~1" --pretty=format:"- %s" --no-merges)
          else
            LOG=$(git log HEAD~1 --pretty=format:"- %s" --no-merges)
          fi
          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ZIG_VERSION: ${{ needs.prepare.outputs.zig_version }}
          CHANGELOG: ${{ steps.changelog.outputs.log }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "## Changes
          ${CHANGELOG}

          ## Zig compatibility
          Built with and requires Zig \`${ZIG_VERSION}\`.

          ## Using zzdds as a Zig package
          \`\`\`
          zig fetch --save https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz
          \`\`\`

          ## Prebuilt C/C++ library bundles
          \`zzdds-<version>-<platform>.tar.gz\` below each unpack to a
          relocatable install prefix (\`include/\`, \`lib/\` with pkg-config +
          CMake package files). Point \`CMAKE_PREFIX_PATH\` at the unpacked
          directory, or \`PKG_CONFIG_PATH\` at its \`lib/pkgconfig\`
          subdirectory." \
            dist/*.tar.gz

      - name: Bump to post-release dev version
        env:
          FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
        run: |
          sed -i 's/\.version = "[^"]*"/.version = "'"${FULL_VERSION}-dev"'"/' build.zig.zon
          git add build.zig.zon
          git commit -m "chore: begin post-${{ needs.prepare.outputs.tag }} development"
          git push
