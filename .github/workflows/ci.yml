name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      vendor_filter:
        description: '"default" = gated vendors only; "all" = every vendor in the pinned release'
        required: false
        default: default
        type: choice
        options:
          - default
          - all
      dds_rtps_ref:
        description: 'zz-iot/dds-rtps branch or tag to check out (default: pinned release tag)'
        required: false
        default: ''
        type: string
      zzdds_examples_ref:
        description: 'zz-iot/zzdds-examples commit/branch/tag to check out (default: pinned commit)'
        required: false
        default: ''
        type: string
  schedule:
    # Weekly full-vendor interop sweep — Mondays 06:00 UTC
    - cron: '0 6 * * 1'

# Cancel in-progress runs for the same ref on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned omg-dds/dds-rtps release used for vendor interop binaries.
# Bump this tag when you want to pick up a new release (may change the vendor list).
#
# INTEROP_RTPS_REF: zz-iot/dds-rtps branch/tag checked out for the test harness.
# Points to the zenzen branch that tracks zzdds C-ABI work.
# Override via the dds_rtps_ref workflow_dispatch input to test a different branch or tag.
env:
  INTEROP_RELEASE_TAG: v2.1.2026
  # NOTE: When updating the zenzen branch, bump the fallback below to the new branch name.
  INTEROP_RTPS_REF: ${{ inputs.dds_rtps_ref || 'zenzen-a9f61ee' }}
  # Pinned zz-iot/zzdds-examples commit for the examples-smoke-test job below.
  # Deliberately a commit, not "main" — the examples job executes that repo's
  # own scripts directly in this workflow's authenticated context, so a
  # floating branch ref would let anyone who can push to zzdds-examples' main
  # (or compromise it) run arbitrary code here the next time this job fires.
  # Bump deliberately (its own small PR) when zzdds-examples gains something
  # this job should pick up. Override via the zzdds_examples_ref
  # workflow_dispatch input to test against a different commit/branch/tag.
  ZZDDS_EXAMPLES_REF: ${{ inputs.zzdds_examples_ref || '24d8930b871ab92d42c7521f21540e6282656198' }}

jobs:
  # ── Unit tests: Linux x86_64 (gates interop jobs below) ───────────────────
  test-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Run deterministic matrix
        run: python3 scripts/run_deterministic_matrix.py --include-tsan

      - name: DebugAllocator lane (default allocator path only, additive to the matrix above)
        run: zig build test -Ddebug-allocator=true

      - name: C/C++ binding smoke tests
        run: zig build test-bindings -Dc-binding=true -Dcpp-binding=true

  # ── Unit tests: remaining platforms (independent of interop) ──────────────
  test-other:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    # No platform here has ever legitimately taken more than ~8 minutes; a
    # hang defaults to GitHub's 360-minute job cap otherwise, which is what
    # let a stuck Windows run burn ~58 minutes before it got noticed and
    # cancelled by hand. 20 minutes is generous headroom, not a tight budget.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Allow inbound UDP (Windows)
        if: runner.os == 'Windows'
        run: netsh advfirewall firewall add rule name="zzdds-test-udp" protocol=UDP dir=in action=allow

      - name: Test
        # --test-timeout: diagnostic for the Windows hang investigation —
        # Zig's own test runner terminates and *names* whichever individual
        # test exceeds this, instead of the whole job running out the
        # timeout-minutes budget with no indication of which test binary (or
        # test within it) was actually stuck. 60s is generous headroom for
        # any single test; the whole suite normally finishes in well under
        # 10 minutes on every platform. Safe to leave in permanently once
        # this investigation is done — it's a real safety net, not just a
        # temporary probe.
        run: zig build test --test-timeout 60s

  # ── zzdds-examples smoke test ──────────────────────────────────────────────
  #
  # Builds zzdds with every binding enabled, then runs zz-iot/zzdds-examples'
  # own orchestrator (run_all.py) against that build — catches a PR breaking
  # any of the C/C++/Java example apps, or their cross-binding-interop/opencv
  # smoke tests, independent of the dds-rtps interop coverage below.
  #
  # --strict turns "zzdds-examples couldn't find a binding/dependency it
  # needs" into a hard failure instead of a silent skip — appropriate here
  # since every binding and OpenCV are deliberately installed in this job, so
  # a skip would mean something regressed, not that the environment is just
  # missing an optional piece (see run_all.py's own default, unstrict
  # behavior for the latter case).

  examples:
    name: zzdds-examples
    needs: test-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          path: zzdds
          # Neither checkout in this job ever pushes; leaving no persisted
          # token in either repo's git config means nothing zzdds-examples'
          # own scripts run below could read one out of, even accidentally.
          persist-credentials: false

      - name: Check out zzdds-examples (${{ env.ZZDDS_EXAMPLES_REF }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/zzdds-examples
          ref: ${{ env.ZZDDS_EXAMPLES_REF }}
          path: zzdds-examples
          persist-credentials: false

      - name: Resolve zidl ref from zzdds/build.zig.zon
        # zig/shape's build.zig.zon depends on ../../../zidl (a sibling of
        # zzdds-examples, i.e. $GITHUB_WORKSPACE/zidl) — without checking it
        # out, its build fails outright since that path never exists
        # otherwise. Deliberately read out of zzdds's OWN pinned .zidl.url
        # here rather than a second independently-maintained ref: the whole
        # point of this job is to build zig/shape against the exact zidl
        # zzdds itself was just built with, so there is only one source of
        # truth to bump (build.zig.zon) — not two that can drift apart.
        id: zidl_ref
        run: |
          set -euo pipefail
          TAG=$(grep -A2 '\.zidl = \.{' zzdds/build.zig.zon | grep -oP 'refs/tags/\K[^"]+(?=\.tar\.gz)')
          if [ -z "$TAG" ]; then
            echo "FAIL: could not parse a zidl tag out of zzdds/build.zig.zon's .zidl.url" >&2
            exit 1
          fi
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out zidl (${{ steps.zidl_ref.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/zidl
          ref: ${{ steps.zidl_ref.outputs.ref }}
          path: zidl
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install JDK (java-binding needs jni.h, not just a JRE)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python (zzdds-examples' build/run/smoke-test scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCV (for cpp/opencv_zzdds)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev

      - name: Build zzdds (all bindings)
        working-directory: zzdds
        run: zig build -Dc-binding=true -Dcpp-binding=true -Djava-binding=true install

      - name: Run zzdds-examples (strict)
        working-directory: zzdds-examples
        run: ZZDDS_ZIG_OUT="$GITHUB_WORKSPACE/zzdds/zig-out" ./run_all.py --strict

  # ── zzdds-examples: WaitSet + ThreadSanitizer ────────────────────────────
  #
  # Separate from the `examples` job above, which builds/runs ALL of
  # zzdds-examples with a plain (non-TSAN) build. This job instead builds
  # zzdds with -Dsanitize-thread=true and runs specifically the zig/waitset
  # and cpp/waitset examples under TSAN -- the ones whose whole point is
  # exercising real concurrency (a watchdog thread and the main thread's
  # WaitSet.wait() loop both touching the same WaitSet/GuardCondition at
  # once; see zzdds-examples' docs/design/waitset-reference-app.md).
  #
  # java/waitset is deliberately NOT run under TSAN here: JVM+TSAN is a
  # known-hard combination in general (see vendor-interop-tsan's own comment
  # on RTI Connext under TSAN for the same class of
  # "known-flaky-under-TSan-timing" precedent elsewhere in this workflow) --
  # not attempted here rather than assumed to work. This job covers what it
  # covers; extending it further is a stretch goal, not something this
  # comment claims is done.

  examples-tsan:
    name: zzdds-examples (TSAN)
    needs: test-linux
    runs-on: ubuntu-latest
    # Was 20 for 3 examples (zig/c/cpp waitset); now 8 examples (+shape,
    # +custom-allocator in both C and C++) -- more builds and more runs,
    # plus custom-allocator's own up-to-~40s-per-side internal poll timeout.
    timeout-minutes: 35

    steps:
      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          path: zzdds
          persist-credentials: false

      - name: Check out zzdds-examples (${{ env.ZZDDS_EXAMPLES_REF }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/zzdds-examples
          ref: ${{ env.ZZDDS_EXAMPLES_REF }}
          path: zzdds-examples
          persist-credentials: false

      # See the `examples` job above's identical step for why this reads
      # zzdds's own pinned .zidl.url rather than a second, independently
      # maintained ref.
      - name: Resolve zidl ref from zzdds/build.zig.zon
        id: zidl_ref
        run: |
          set -euo pipefail
          TAG=$(grep -A2 '\.zidl = \.{' zzdds/build.zig.zon | grep -oP 'refs/tags/\K[^"]+(?=\.tar\.gz)')
          if [ -z "$TAG" ]; then
            echo "FAIL: could not parse a zidl tag out of zzdds/build.zig.zon's .zidl.url" >&2
            exit 1
          fi
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out zidl (${{ steps.zidl_ref.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/zidl
          ref: ${{ steps.zidl_ref.outputs.ref }}
          path: zidl
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # ubuntu-latest's default ASLR entropy (vm.mmap_rnd_bits) is higher
      # than TSan's fixed shadow-memory layout reliably tolerates -- an
      # intermittent, ASLR-placement-dependent failure during the TSan
      # runtime's own startup, before it can print anything. Looks identical
      # to a real crash (instant SIGSEGV, no TSan report at all) but is not
      # one: confirmed via a CI-side gdb backtrace (this exact job, since
      # removed once its purpose was served) showing the crash deep inside
      # the TSan runtime's own __cxa_atexit interceptor, on the main thread,
      # before any application code runs -- and confirmed NOT reproducible
      # locally across dozens of runs with byte-identical binaries/config.
      # This lower-entropy sysctl alone was tried first and did NOT resolve
      # it (still crashed identically on the next CI run); the actual
      # per-process fix is disabling ASLR outright via `setarch -R`, applied
      # to every TSAN pub/sub pair in run_tsan_pubsub_pair.py (zzdds-examples
      # repo) -- kept here too since it's a legitimate, complementary
      # belt-and-suspenders measure for anything setarch's wrapping doesn't
      # cover (e.g. cmake's own build-time compiler probes).
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build zzdds (C + C++ bindings, ThreadSanitizer)
        working-directory: zzdds
        run: zig build -Dc-binding=true -Dcpp-binding=true -Dsanitize-thread=true install

      - name: Build zig/waitset (ThreadSanitizer)
        working-directory: zzdds-examples/zig/waitset
        run: zig build -Dsanitize-thread=true

      # Two distinct bugs were found and fixed here, both confirmed via
      # standalone local repro (not just code review):
      #
      # 1. (All languages, any compiler) cpp/waitset and c/waitset both died
      #    instantly on startup with no TSan report at all, deep inside the
      #    TSan runtime's own __cxa_atexit interceptor. Cause: two independent
      #    copies of the TSan runtime in one process -- one statically
      #    embedded in libzzdds.so by Zig's own final link of that shared
      #    library, another statically embedded in the example executable by
      #    ITS OWN final link. Fixed at the CMakeLists.txt level (see
      #    cpp/waitset/CMakeLists.txt's WAITSET_SANITIZE_THREAD option):
      #    compile the example's own code with -fsanitize=thread as before,
      #    but do NOT pass -fsanitize=thread to the final link, so only
      #    libzzdds.so's runtime is ever loaded into the process -- the
      #    example's own __tsan_*/interceptor references resolve against
      #    that one runtime at load time. Confirmed both non-crashing and
      #    still catching real races, including races entirely within
      #    example code (not just inside zzdds), so this keeps full
      #    instrumentation coverage. Sufficient by itself for the C examples.
      #
      # 2. (C++ examples specifically, only with the runner's default GCC/
      #    GNU-ld toolchain) even after fixing (1), cpp/waitset still
      #    crashed -- this time inside TSan's own SlotLock, called via its
      #    pthread_once interceptor, called from libstdc++.so.6's OWN
      #    constructor (std::ios_base_library_init, run by the dynamic
      #    linker during process startup). Cause: libstdc++.so.6 is a
      #    separate DT_NEEDED shared object with no ordering relationship to
      #    libzzdds.so, so the dynamic linker can (and does, under GNU ld's
      #    default link order) run libstdc++'s constructor -- which calls an
      #    intercepted pthread_once -- before libzzdds.so's own constructor
      #    has initialized TSan's per-thread state, crashing on a null/
      #    not-yet-initialized ThreadState. `zig c++` sidesteps this
      #    entirely by statically linking its C++ runtime (confirmed via
      #    `ldd`: no libstdc++.so.6 dependency at all in the working build),
      #    so there's no second, independently-ordered constructor to race
      #    against. C examples never link libstdc++ and are unaffected --
      #    confirmed c/waitset builds and runs clean with the plain runner
      #    default compiler, no wrapper needed.
      - name: Set up a zig c++ wrapper for the C++ TSan builds
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/zig-cc-wrappers"
          printf '#!/usr/bin/env bash\nexec zig c++ "$@"\n' > "$GITHUB_WORKSPACE/zig-cc-wrappers/zigcxx"
          chmod +x "$GITHUB_WORKSPACE/zig-cc-wrappers/zigcxx"

      - name: Build cpp/waitset (ThreadSanitizer)
        run: |
          cmake -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/zzdds/zig-out" -DCMAKE_CXX_COMPILER="$GITHUB_WORKSPACE/zig-cc-wrappers/zigcxx" -DWAITSET_SANITIZE_THREAD=ON \
            -B zzdds-examples/cpp/waitset/build -S zzdds-examples/cpp/waitset
          cmake --build zzdds-examples/cpp/waitset/build

      - name: Build c/waitset (ThreadSanitizer)
        run: |
          cmake -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/zzdds/zig-out" -DWAITSET_SANITIZE_THREAD=ON \
            -B zzdds-examples/c/waitset/build -S zzdds-examples/c/waitset
          cmake --build zzdds-examples/c/waitset/build

      - name: Build zig/shape (ThreadSanitizer)
        working-directory: zzdds-examples/zig/shape
        run: zig build -Dsanitize-thread=true

      - name: Build cpp/shape (ThreadSanitizer)
        run: |
          cmake -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/zzdds/zig-out" -DCMAKE_CXX_COMPILER="$GITHUB_WORKSPACE/zig-cc-wrappers/zigcxx" -DSHAPE_SANITIZE_THREAD=ON \
            -B zzdds-examples/cpp/shape/build -S zzdds-examples/cpp/shape
          cmake --build zzdds-examples/cpp/shape/build

      - name: Build c/shape (ThreadSanitizer)
        run: |
          cmake -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/zzdds/zig-out" -DSHAPE_SANITIZE_THREAD=ON \
            -B zzdds-examples/c/shape/build -S zzdds-examples/c/shape
          cmake --build zzdds-examples/c/shape/build

      - name: Build cpp/custom-allocator (ThreadSanitizer)
        run: |
          cmake -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/zzdds/zig-out" -DCMAKE_CXX_COMPILER="$GITHUB_WORKSPACE/zig-cc-wrappers/zigcxx" -DCUSTOM_ALLOCATOR_SANITIZE_THREAD=ON \
            -B zzdds-examples/cpp/custom-allocator/build -S zzdds-examples/cpp/custom-allocator
          cmake --build zzdds-examples/cpp/custom-allocator/build

      - name: Build c/custom-allocator (ThreadSanitizer)
        run: |
          cmake -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/zzdds/zig-out" -DCUSTOM_ALLOCATOR_SANITIZE_THREAD=ON \
            -B zzdds-examples/c/custom-allocator/build -S zzdds-examples/c/custom-allocator
          cmake --build zzdds-examples/c/custom-allocator/build

      # Shared run/verify logic (background subscriber, foreground publisher
      # with a timeout, check both exit codes AND a completion marker in
      # each log -- a wire/QoS mismatch or a hang can still exit 0 on one
      # side) lives in zzdds-examples/scripts/run_tsan_pubsub_pair.py, not
      # copy-pasted per step: this job went from 3 examples to 8, and the
      # hand-rolled ~15-20-line bash block per step doesn't scale past the
      # original 3. Python, not bash, per that script's own docstring --
      # this repo already hit a 40+ minute hang from a similar
      # background/foreground pattern in bash.
      - name: Run zig/waitset under TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        run: |
          python3 zzdds-examples/scripts/run_tsan_pubsub_pair.py \
            --sub-cmd "zzdds-examples/zig/waitset/zig-out/bin/waitset_sub -d 30" \
            --pub-cmd "zzdds-examples/zig/waitset/zig-out/bin/waitset_pub -d 30" \
            --sub-log /tmp/zig-ws-sub.log --pub-log /tmp/zig-ws-pub.log \
            --sub-marker "Subscriber: received all 10 samples." \
            --pub-marker "Publisher: done." --timeout 40

      - name: Run cpp/waitset under TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        run: |
          python3 zzdds-examples/scripts/run_tsan_pubsub_pair.py \
            --sub-cmd "zzdds-examples/cpp/waitset/build/waitset_sub -d 31" \
            --pub-cmd "zzdds-examples/cpp/waitset/build/waitset_pub -d 31" \
            --sub-log /tmp/cpp-ws-sub.log --pub-log /tmp/cpp-ws-pub.log \
            --sub-marker "Subscriber: received all 10 samples." \
            --pub-marker "Publisher: done." --timeout 40 \
            --ld-library-path "$GITHUB_WORKSPACE/zzdds/zig-out/lib"

      - name: Run c/waitset under TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        run: |
          python3 zzdds-examples/scripts/run_tsan_pubsub_pair.py \
            --sub-cmd "zzdds-examples/c/waitset/build/waitset_sub -d 32" \
            --pub-cmd "zzdds-examples/c/waitset/build/waitset_pub -d 32" \
            --sub-log /tmp/c-ws-sub.log --pub-log /tmp/c-ws-pub.log \
            --sub-marker "Subscriber: received all 10 samples." \
            --pub-marker "Publisher: done." --timeout 40 \
            --ld-library-path "$GITHUB_WORKSPACE/zzdds/zig-out/lib"

      # shape_main exits on its own after -i iterations (no external
      # duration/timeout needed the way waitset's -d flag provides); markers
      # mirror zzdds-examples' own shape_cross_binding_smoke_test.py (a real
      # match + a real received-sample line, not just a clean exit).
      - name: Run zig/shape under TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        run: |
          python3 zzdds-examples/scripts/run_tsan_pubsub_pair.py \
            --sub-cmd "zzdds-examples/zig/shape/zig-out/bin/shape_main -S -i 8 --read-period 300" \
            --pub-cmd "zzdds-examples/zig/shape/zig-out/bin/shape_main -P -w -i 8 --write-period 300" \
            --sub-log /tmp/zig-shape-sub.log --pub-log /tmp/zig-shape-pub.log \
            --sub-marker "Square" --pub-marker "on_publication_matched()" --timeout 30

      - name: Run cpp/shape under TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        run: |
          python3 zzdds-examples/scripts/run_tsan_pubsub_pair.py \
            --sub-cmd "zzdds-examples/cpp/shape/build/shape_main -S -i 8 --read-period 300" \
            --pub-cmd "zzdds-examples/cpp/shape/build/shape_main -P -w -i 8 --write-period 300" \
            --sub-log /tmp/cpp-shape-sub.log --pub-log /tmp/cpp-shape-pub.log \
            --sub-marker "Square" --pub-marker "on_publication_matched()" --timeout 30 \
            --ld-library-path "$GITHUB_WORKSPACE/zzdds/zig-out/lib"

      - name: Run c/shape under TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        run: |
          python3 zzdds-examples/scripts/run_tsan_pubsub_pair.py \
            --sub-cmd "zzdds-examples/c/shape/build/shape_main -S -i 8 --read-period 300" \
            --pub-cmd "zzdds-examples/c/shape/build/shape_main -P -w -i 8 --write-period 300" \
            --sub-log /tmp/c-shape-sub.log --pub-log /tmp/c-shape-pub.log \
            --sub-marker "Square" --pub-marker "on_publication_matched()" --timeout 30 \
            --ld-library-path "$GITHUB_WORKSPACE/zzdds/zig-out/lib"

      # custom-allocator's publisher/subscriber take no CLI flags (hardcoded
      # sample/log counts and an internal poll-timeout of their own -- up to
      # ~40s worst case under TSan's slowdown, hence the generous --timeout);
      # markers match their own literal "done" print lines. Run from inside
      # the build dir since these binaries look for ./zzdds.toml relative to cwd.
      - name: Run cpp/custom-allocator under TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        working-directory: zzdds-examples/cpp/custom-allocator/build
        run: |
          python3 "$GITHUB_WORKSPACE/zzdds-examples/scripts/run_tsan_pubsub_pair.py" \
            --sub-cmd "./subscriber" --pub-cmd "./publisher" \
            --sub-log /tmp/cpp-ca-sub.log --pub-log /tmp/cpp-ca-pub.log \
            --sub-marker "subscriber: done" --pub-marker "publisher: done" --timeout 60 \
            --ld-library-path "$GITHUB_WORKSPACE/zzdds/zig-out/lib"

      - name: Run c/custom-allocator under TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        working-directory: zzdds-examples/c/custom-allocator/build
        run: |
          python3 "$GITHUB_WORKSPACE/zzdds-examples/scripts/run_tsan_pubsub_pair.py" \
            --sub-cmd "./subscriber" --pub-cmd "./publisher" \
            --sub-log /tmp/c-ca-sub.log --pub-log /tmp/c-ca-pub.log \
            --sub-marker "subscriber: done" --pub-marker "publisher: done" --timeout 60 \
            --ld-library-path "$GITHUB_WORKSPACE/zzdds/zig-out/lib"

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Builds all test binaries to zig-out/tests/, runs each through kcov
  # (DWARF-based instrumentation — no compiler changes needed), and uploads
  # the merged cobertura.xml to Codecov.
  #
  # Runs on the same trigger as the test jobs; gated on test-linux so coverage
  # only uploads when the suite is green.

  valgrind:
    name: Valgrind (memcheck)
    needs: test-linux
    runs-on: ubuntu-latest
    # Was 15 -- loopback_test.zig's polling deadlines were just raised (5s/3s
    # -> 20s/15s) to stop spurious failures on a busy shared runner (see that
    # file's comments), which raises this job's own worst-case ceiling too.
    # A normal passing run is unaffected either way (those deadlines only
    # matter on the slow path); this just gives that slow path enough room
    # to actually recover instead of getting killed by the job timeout first.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Build test binaries
        run: zig build emit-tests -Doptimize=Debug

      - name: Run tests under Valgrind
        run: |
          set -e
          ERRORS=0
          for bin in zig-out/tests/*; do
            [ -x "$bin" ] || continue
            echo "=== valgrind: $(basename $bin) ==="
            if ! valgrind \
                --error-exitcode=1 \
                --leak-check=full \
                --show-leak-kinds=definite,indirect \
                --errors-for-leak-kinds=definite,indirect \
                --track-origins=yes \
                --quiet \
                "$bin"; then
              echo "::error::Valgrind reported errors in $(basename $bin)"
              ERRORS=$((ERRORS + 1))
            fi
          done
          [ $ERRORS -eq 0 ]

  coverage:
    name: Coverage
    needs: test-linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Cache kcov and patched elfutils
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: |
            /tmp/kcov-src
            /tmp/kcov-build
            /tmp/elfutils-patched
          key: kcov-v42-elfutils-uleb128-${{ runner.os }}

      - name: Install kcov build and runtime dependencies
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            binutils-dev libdw-dev libcurl4-openssl-dev \
            zlib1g-dev libiberty-dev cmake libcurl4

      - name: Build patched elfutils and kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          # Patch elfutils 0.195: fix extended opcode length to use ULEB128
          # (DWARF spec 6.2.5.3).  Zig 0.16.0 emits vendor extended opcodes
          # with body length >= 128; libdw reads only the first ULEB byte,
          # misidentifies the sub-opcode, and misparses the rest of the stream.
          cd /tmp
          wget -q https://sourceware.org/elfutils/ftp/0.195/elfutils-0.195.tar.bz2
          echo "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026  elfutils-0.195.tar.bz2" | sha256sum --check
          tar xjf elfutils-0.195.tar.bz2
          cat > /tmp/patch_elfutils.py << 'PYEOF'
          import sys
          fname = '/tmp/elfutils-0.195/libdw/dwarf_getsrclines.c'
          with open(fname) as f:
              s = f.read()
          old = '\t  if (unlikely (lineendp - linep < 2))\n\t    goto invalid_data;\n\n\t  /* The length.  */\n\t  uint_fast8_t len = *linep++;'
          new = '\t  if (unlikely (linep >= lineendp))\n\t    goto invalid_data;\n\n\t  /* Extended opcode length is ULEB128 per DWARF spec 6.2.5.3.  */\n\t  Dwarf_Word len;\n\t  get_uleb128 (len, linep, lineendp);'
          if old not in s:
              sys.exit('elfutils patch target not found')
          with open(fname, 'w') as f:
              f.write(s.replace(old, new, 1))
          print('elfutils ULEB128 fix applied')
          PYEOF
          python3 /tmp/patch_elfutils.py
          cd /tmp/elfutils-0.195
          ./configure --prefix=/tmp/elfutils-patched \
            --disable-nls --disable-debuginfod
          make -j$(nproc)
          make install
          # Build kcov linked against patched elfutils
          git clone --depth=1 --branch v42 https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/elfutils-patched
          make -C /tmp/kcov-build -j$(nproc)

      - name: Install patched libdw and kcov
        run: |
          sudo install -m755 /tmp/elfutils-patched/lib/libdw-0.195.so \
            /usr/local/lib/libdw-0.195.so
          sudo ln -sf /usr/local/lib/libdw-0.195.so /usr/local/lib/libdw.so.1
          sudo ldconfig
          sudo cp /tmp/kcov-build/src/kcov /usr/local/bin/kcov

      - name: Build test binaries
        run: zig build emit-tests

      - name: Run tests under kcov
        run: |
          mkdir -p coverage
          for bin in zig-out/tests/*; do
            kcov --include-path="$(pwd)/src" --exclude-line=unreachable,@panic coverage/ "$bin" || true
          done

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/kcov-merged/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcov-coverage
          path: coverage/kcov-merged/
          retention-days: 14

  # ── Resolve vendor matrix ──────────────────────────────────────────────────
  #
  # Queries the pinned omg-dds/dds-rtps release for *_shape_main_linux assets,
  # filters to the gated set (or all), and emits a JSON vendor matrix.
  # Runs in parallel with the self-interop jobs; vendor-interop jobs wait for both.

  setup-matrix:
    name: Resolve vendor matrix
    needs: test-linux
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

    steps:
      - name: Build vendor matrix
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          VENDOR_FILTER: ${{ github.event_name == 'schedule' && 'all' || inputs.vendor_filter || 'default' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          tag = os.environ['INTEROP_RELEASE_TAG']
          vendor_filter = os.environ.get('VENDOR_FILTER', 'default')

          # Asset-name prefixes included in the gated (default) CI set.
          # Extend when a new partner reaches a known-good interop state.
          #
          # eprosima_fastdds and opendds are temporarily demoted (2026-07-14):
          # both have persistent, vendor-side Test_Lifespan_* failures unrelated
          # to zzdds (FastDDS's reader never enforces Lifespan expiry at all —
          # confirmed via FastDDS-vs-FastDDS self-interop, which also fails all
          # 8 Lifespan tests; OpenDDS's SEDP PID_LIFESPAN/PID_DEADLINE wire
          # encoding is non-compliant, raw nanoseconds in the RTPS fraction
          # field — root-caused directly against OpenDDS master source, fix
          # prepared upstream). Re-promote once fixed on their end.
          #
          # toc_coredx_dds is promoted (2026-07-14): full suite is clean in one
          # direction (105/105) and 103/105 in the other. The 2 failures
          # (Test_CoherentSets_10/19) are a rare (~1/15 runs), spec-compliant
          # flake — CoreDX sends all topics' coherent-set-completing data
          # within microseconds of each other (confirmed via pcap), so the
          # occasional single-poll-cycle lag is internal zzdds reader-dispatch
          # jitter across independent per-topic StatefulReaders, not a wire or
          # protocol bug. Tracked as a follow-up; not blocking.
          DEFAULT_PREFIXES = [
              'connext_dds',
              'eclipse_cyclone',
              'toc_coredx_dds',
          ]

          result = subprocess.run(
              ['gh', 'api', f'repos/omg-dds/dds-rtps/releases/tags/{tag}',
               '--jq', '[.assets[] | select(.name | endswith("_shape_main_linux.zip")) | .name]'],
              capture_output=True, text=True, check=True,
          )
          assets = json.loads(result.stdout)

          if vendor_filter != 'all':
              assets = [a for a in assets if any(a.startswith(p) for p in DEFAULT_PREFIXES)]

          if not assets:
              print('::error::No vendor binaries matched — check INTEROP_RELEASE_TAG and DEFAULT_PREFIXES', flush=True)
              sys.exit(1)

          matrix = [
              {'asset': a, 'binary': a[:-4], 'name': a.replace('_shape_main_linux.zip', '')}
              for a in assets
          ]
          print(f'Vendors ({vendor_filter}): {[m["name"] for m in matrix]}', flush=True)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={json.dumps(matrix)}\n')
          PYEOF

  # ── Interop: Zenzen DDS vs Zenzen DDS ─────────────────────────────────────
  #
  # Checkout layout (relative to $GITHUB_WORKSPACE):
  #   zzdds/      — this repo
  #   dds-rtps/   — zz-iot/dds-rtps fork at INTEROP_RTPS_REF
  #
  # The packages/zzdds symlink inside zzdds points four levels up:
  #   dds-rtps/srcZig/zzdds/packages/zzdds -> ../../../../zzdds
  # which resolves to $GITHUB_WORKSPACE/zzdds — exactly our checkout path.
  #
  # ubuntu-22.04: vendor prebuilt binaries require this image; use the same
  # runner here so the zzdds binary we upload is glibc-compatible with it.

  self-interop:
    name: self-interop (dds-rtps)
    needs: test-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          path: zzdds
          persist-credentials: false

      - name: Check out dds-rtps (${{ env.INTEROP_RTPS_REF }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/dds-rtps
          ref: ${{ env.INTEROP_RTPS_REF }}
          path: dds-rtps
          persist-credentials: false

      - name: Wire packages/zzdds symlink
        run: |
          mkdir -p dds-rtps/srcZig/zzdds/packages
          ln -s ../../../../zzdds dds-rtps/srcZig/zzdds/packages/zzdds
          # zzdds now re-exports zidl's own artifact and zidl_rt module (see
          # zzdds's build.zig comment on b.modules.put(... "zidl_rt" ...) /
          # b.installArtifact(zidl_exe)), and dds-rtps's build.zig.zon no
          # longer declares its own .zidl dependency — zig resolves zidl
          # transitively through this zzdds path dep, so no separate zidl
          # checkout/symlink is needed here anymore.
          #
          # zig-pkg/ is gitignored so actions/checkout does not clean it between
          # runs on the same runner.  Stale URL-fetched packages shadow the path
          # dep above via fingerprint deduplication — wipe them first.
          rm -rf dds-rtps/srcZig/zzdds/zig-pkg/
          (cd dds-rtps/srcZig/zzdds && python3 point_zon_at_symlinks.py)

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Python dependencies
        run: pip install pexpect junitparser

      - name: Build shape_main (ReleaseSafe)
        working-directory: dds-rtps/srcZig/zzdds
        run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe

      - name: Upload zzdds binary (for vendor-interop jobs)
        uses: actions/upload-artifact@v4
        with:
          name: zzdds-shape-linux-normal
          path: dds-rtps/srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux
          retention-days: 1

      - name: Run self-interop suite
        working-directory: dds-rtps
        run: |
          python3 interoperability_report.py \
            -P srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux \
            -S srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux \
            -o /tmp/interop-results.xml

      - name: Check results
        run: python3 zzdds/scripts/check_interop_results.py /tmp/interop-results.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-results
          path: /tmp/interop-results.xml

  self-interop-tsan:
    name: self-interop (dds-rtps) + TSAN
    needs: test-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          path: zzdds
          persist-credentials: false

      - name: Check out dds-rtps (${{ env.INTEROP_RTPS_REF }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/dds-rtps
          ref: ${{ env.INTEROP_RTPS_REF }}
          path: dds-rtps
          persist-credentials: false

      - name: Wire packages/zzdds symlink
        run: |
          mkdir -p dds-rtps/srcZig/zzdds/packages
          ln -s ../../../../zzdds dds-rtps/srcZig/zzdds/packages/zzdds
          # zzdds re-exports zidl's own artifact/zidl_rt module and
          # dds-rtps's build.zig.zon no longer declares its own .zidl
          # dependency, so no separate zidl checkout/symlink is needed here
          # (see the self-interop job above for the full explanation).
          rm -rf dds-rtps/srcZig/zzdds/zig-pkg/
          (cd dds-rtps/srcZig/zzdds && python3 point_zon_at_symlinks.py)

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Python dependencies
        run: pip install pexpect junitparser

      - name: Build shape_main (Debug + ThreadSanitizer)
        working-directory: dds-rtps/srcZig/zzdds
        run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=Debug -Dlog-level=info -Dsanitize-thread

      - name: Upload zzdds binary (TSan, for vendor-interop-tsan jobs)
        uses: actions/upload-artifact@v4
        with:
          name: zzdds-shape-linux-tsan
          path: dds-rtps/srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux
          retention-days: 1

      - name: Run self-interop suite (TSan)
        working-directory: dds-rtps
        env:
          # TSAN writes its race report to stderr, which pexpect captures via
          # the pty — so the report ends up inside the JUnit XML failure message
          # and is displayed by check_interop_results.py below.
          # abort_on_error=1 kills the process on the first race, causing
          # pexpect to see an unexpected exit and mark the test as failed.
          TSAN_OPTIONS: abort_on_error=1
        run: |
          python3 interoperability_report.py \
            -P srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux \
            -S srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux \
            -o /tmp/interop-tsan-results.xml

      - name: Check results
        run: python3 zzdds/scripts/check_interop_results.py /tmp/interop-tsan-results.xml

      - name: Upload TSan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-tsan-results
          path: /tmp/interop-tsan-results.xml

  # ── Interop: Zenzen DDS vs vendor (normal) ────────────────────────────────
  #
  # Matrix: vendor (dynamic, from pinned release) × direction (pub | sub)
  #   pub: zzdds publishes, vendor subscribes   (-P zzdds -S vendor)
  #   sub: vendor publishes, zzdds subscribes   (-P vendor -S zzdds)
  #
  # Each combination runs on its own runner so jobs are fully parallel and
  # there are no UDP port conflicts between vendors.
  #
  # Gated on self-interop so vendor jobs only start when zzdds is self-consistent.

  vendor-interop-normal:
    name: "${{ matrix.vendor.name }} / ${{ matrix.direction }}"
    needs: [setup-matrix, self-interop]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        vendor: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        direction: [pub, sub]

    steps:
      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          path: zzdds
          persist-credentials: false

      - name: Check out dds-rtps (${{ env.INTEROP_RTPS_REF }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/dds-rtps
          ref: ${{ env.INTEROP_RTPS_REF }}
          path: dds-rtps
          persist-credentials: false

      - name: Install Python dependencies
        run: pip install pexpect junitparser

      - name: Download zzdds binary
        uses: actions/download-artifact@v4
        with:
          name: zzdds-shape-linux-normal
          path: bins/

      - name: Download vendor binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ env.INTEROP_RELEASE_TAG }} \
            --repo omg-dds/dds-rtps \
            --pattern "${{ matrix.vendor.asset }}" \
            -D bins/
          unzip -o bins/${{ matrix.vendor.asset }} -d bins/

      - name: Make binaries executable
        run: chmod +x bins/zzdds_shape_main_linux bins/${{ matrix.vendor.binary }}

      - name: Run interop (${{ matrix.direction }})
        working-directory: dds-rtps
        run: |
          ZZDDS="$GITHUB_WORKSPACE/bins/zzdds_shape_main_linux"
          VENDOR="$GITHUB_WORKSPACE/bins/${{ matrix.vendor.binary }}"
          if [ "${{ matrix.direction }}" = "pub" ]; then
            PUB="$ZZDDS"; SUB="$VENDOR"
          else
            PUB="$VENDOR"; SUB="$ZZDDS"
          fi
          python3 interoperability_report.py -P "$PUB" -S "$SUB" \
            -o /tmp/interop-${{ matrix.vendor.name }}-${{ matrix.direction }}.xml

      - name: Check results
        run: |
          python3 zzdds/scripts/check_interop_results.py \
            /tmp/interop-${{ matrix.vendor.name }}-${{ matrix.direction }}.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-${{ matrix.vendor.name }}-${{ matrix.direction }}
          path: /tmp/interop-${{ matrix.vendor.name }}-${{ matrix.direction }}.xml

  # ── Interop: Zenzen DDS (TSan) vs vendor ──────────────────────────────────
  #
  # Same structure as vendor-interop-normal but uses the TSan-instrumented zzdds.
  # A race causes the process to abort (TSAN_OPTIONS=abort_on_error=1), which
  # pexpect sees as EOF; the test is marked failed and the TSAN report is embedded
  # in the JUnit failure message, surfaced by check_interop_results.py.
  #
  # Gated on self-interop-tsan, which itself must pass first.

  vendor-interop-tsan:
    name: "TSan: ${{ matrix.vendor.name }} / ${{ matrix.direction }}"
    needs: [setup-matrix, self-interop-tsan]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        vendor: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        direction: [pub, sub]

    steps:
      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          path: zzdds
          persist-credentials: false

      - name: Check out dds-rtps (${{ env.INTEROP_RTPS_REF }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/dds-rtps
          ref: ${{ env.INTEROP_RTPS_REF }}
          path: dds-rtps
          persist-credentials: false

      - name: Install Python dependencies
        run: pip install pexpect junitparser

      - name: Download zzdds binary (TSan)
        uses: actions/download-artifact@v4
        with:
          name: zzdds-shape-linux-tsan
          path: bins/

      - name: Download vendor binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ env.INTEROP_RELEASE_TAG }} \
            --repo omg-dds/dds-rtps \
            --pattern "${{ matrix.vendor.asset }}" \
            -D bins/
          unzip -o bins/${{ matrix.vendor.asset }} -d bins/

      - name: Make binaries executable
        run: chmod +x bins/zzdds_shape_main_linux bins/${{ matrix.vendor.binary }}

      - name: Run interop TSan (${{ matrix.direction }})
        working-directory: dds-rtps
        env:
          TSAN_OPTIONS: abort_on_error=1
        run: |
          ZZDDS="$GITHUB_WORKSPACE/bins/zzdds_shape_main_linux"
          VENDOR="$GITHUB_WORKSPACE/bins/${{ matrix.vendor.binary }}"
          if [ "${{ matrix.direction }}" = "pub" ]; then
            PUB="$ZZDDS"; SUB="$VENDOR"
          else
            PUB="$VENDOR"; SUB="$ZZDDS"
          fi
          python3 interoperability_report.py -P "$PUB" -S "$SUB" \
            -o /tmp/interop-tsan-${{ matrix.vendor.name }}-${{ matrix.direction }}.xml

      - name: Check results
        run: |
          python3 zzdds/scripts/check_interop_results.py \
            /tmp/interop-tsan-${{ matrix.vendor.name }}-${{ matrix.direction }}.xml

      - name: Upload TSan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-tsan-${{ matrix.vendor.name }}-${{ matrix.direction }}
          path: /tmp/interop-tsan-${{ matrix.vendor.name }}-${{ matrix.direction }}.xml

  # ── Interop: Zenzen DDS self-interop, DebugAllocator lane ─────────────────
  #
  # Mirrors self-interop-tsan's exact structure, but proves the *allocator*
  # side of this repo's safety-net story instead of the threading side:
  # every allocation the factory and everything it creates makes is routed
  # through std.heap.DebugAllocator (see zzdds's -Ddebug-allocator option and
  # dds-rtps's own matching option, both added together with
  # createFactoryWithAllocator) -- fast, attributable double-free/UAF
  # diagnostics instead of relying solely on the (slow, coarse) valgrind job
  # or bare c_allocator's silent heap corruption. Self AND vendor interop
  # both get this lane (not just self): different peer implementations
  # produce different interop timing, and a purely self-interop-only lane
  # would miss any timing-dependent allocator bug that only manifests
  # against a real second implementation.
  self-interop-debug-allocator:
    name: self-interop (dds-rtps) + DebugAllocator
    needs: test-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          path: zzdds
          persist-credentials: false

      - name: Check out dds-rtps (${{ env.INTEROP_RTPS_REF }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/dds-rtps
          ref: ${{ env.INTEROP_RTPS_REF }}
          path: dds-rtps
          persist-credentials: false

      - name: Wire packages/zzdds symlink
        run: |
          mkdir -p dds-rtps/srcZig/zzdds/packages
          ln -s ../../../../zzdds dds-rtps/srcZig/zzdds/packages/zzdds
          # zzdds re-exports zidl's own artifact/zidl_rt module and
          # dds-rtps's build.zig.zon no longer declares its own .zidl
          # dependency, so no separate zidl checkout/symlink is needed here
          # (see the self-interop job above for the full explanation).
          rm -rf dds-rtps/srcZig/zzdds/zig-pkg/
          (cd dds-rtps/srcZig/zzdds && python3 point_zon_at_symlinks.py)

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Python dependencies
        run: pip install pexpect junitparser

      - name: Build shape_main (Debug + DebugAllocator)
        working-directory: dds-rtps/srcZig/zzdds
        run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=Debug -Dlog-level=info -Ddebug-allocator=true

      - name: Upload zzdds binary (DebugAllocator, for vendor-interop-debug-allocator jobs)
        uses: actions/upload-artifact@v4
        with:
          name: zzdds-shape-linux-debug-allocator
          path: dds-rtps/srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux
          retention-days: 1

      - name: Run self-interop suite (DebugAllocator)
        working-directory: dds-rtps
        run: |
          python3 interoperability_report.py \
            -P srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux \
            -S srcZig/zzdds/zig-out/bin/zzdds_shape_main_linux \
            -o /tmp/interop-debug-allocator-results.xml

      - name: Check results
        run: python3 zzdds/scripts/check_interop_results.py /tmp/interop-debug-allocator-results.xml

      - name: Upload DebugAllocator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-debug-allocator-results
          path: /tmp/interop-debug-allocator-results.xml

  vendor-interop-debug-allocator:
    name: "DebugAllocator: ${{ matrix.vendor.name }} / ${{ matrix.direction }}"
    needs: [setup-matrix, self-interop-debug-allocator]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        vendor: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        direction: [pub, sub]

    steps:
      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          path: zzdds
          persist-credentials: false

      - name: Check out dds-rtps (${{ env.INTEROP_RTPS_REF }})
        uses: actions/checkout@v4
        with:
          repository: zz-iot/dds-rtps
          ref: ${{ env.INTEROP_RTPS_REF }}
          path: dds-rtps
          persist-credentials: false

      - name: Install Python dependencies
        run: pip install pexpect junitparser

      - name: Download zzdds binary (DebugAllocator)
        uses: actions/download-artifact@v4
        with:
          name: zzdds-shape-linux-debug-allocator
          path: bins/

      - name: Download vendor binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ env.INTEROP_RELEASE_TAG }} \
            --repo omg-dds/dds-rtps \
            --pattern "${{ matrix.vendor.asset }}" \
            -D bins/
          unzip -o bins/${{ matrix.vendor.asset }} -d bins/

      - name: Make binaries executable
        run: chmod +x bins/zzdds_shape_main_linux bins/${{ matrix.vendor.binary }}

      - name: Run interop DebugAllocator (${{ matrix.direction }})
        working-directory: dds-rtps
        run: |
          ZZDDS="$GITHUB_WORKSPACE/bins/zzdds_shape_main_linux"
          VENDOR="$GITHUB_WORKSPACE/bins/${{ matrix.vendor.binary }}"
          if [ "${{ matrix.direction }}" = "pub" ]; then
            PUB="$ZZDDS"; SUB="$VENDOR"
          else
            PUB="$VENDOR"; SUB="$ZZDDS"
          fi
          python3 interoperability_report.py -P "$PUB" -S "$SUB" \
            -o /tmp/interop-debug-allocator-${{ matrix.vendor.name }}-${{ matrix.direction }}.xml

      - name: Check results
        run: |
          python3 zzdds/scripts/check_interop_results.py \
            /tmp/interop-debug-allocator-${{ matrix.vendor.name }}-${{ matrix.direction }}.xml

      - name: Upload DebugAllocator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-debug-allocator-${{ matrix.vendor.name }}-${{ matrix.direction }}
          path: /tmp/interop-debug-allocator-${{ matrix.vendor.name }}-${{ matrix.direction }}.xml
